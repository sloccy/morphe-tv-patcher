name: live-sources
# Manual: downloads real apps from APKPure and APKMirror on a GitHub runner and runs the
# verification chain. Proves the second source works end to end.
on: workflow_dispatch
jobs:
  apkpure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Install apkeep
        run: |
          v=$(cat apkeep.version)
          sudo curl -fsSL -o /usr/local/bin/apkeep "https://github.com/EFForg/apkeep/releases/download/$v/apkeep-x86_64-unknown-linux-gnu"
          sudo chmod +x /usr/local/bin/apkeep
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends apksigner
          apkeep --version; apksigner --version
      - name: APKPure download + verify
        run: |
          python - <<'PY'
          from pathlib import Path
          from patcher import apkpure, verify
          out = Path("dl"); out.mkdir(exist_ok=True)
          # signers recorded from the real APKMirror downloads on 2026-10-22
          pins = {"com.amazon.amazonvideo.livingroom": "2f19adeb284eb36f7f07786152b9a1d14b21653203ad0b04ebbf9c73ab6d7625",
                  "com.disney.disneyplus": "b4d251e979ea974d8f070feb5ab69fc4c2873f4e8add421ff63ad5f2789d63d4"}
          bad = 0
          for pkg, ver in [("com.amazon.amazonvideo.livingroom", "6.23.23+v15.5.0.70-armv7a"),
                           ("com.disney.disneyplus", "26.16.0+rc2-2026.09.08")]:
              try:
                  f = apkpure.download(pkg, ver, out)
                  i = verify.inspect(f)
                  print(pkg, f.name, f.stat().st_size // 1048576, "MB", {k: i[k] for k in ("package", "version", "leanback", "abis", "signer", "apksigner_ok", "apksigner_msg")})
                  v = verify.verify(f, pkg, ver, "apkpure", pins[pkg])
                  print("  VERIFIED against APKMirror signer:", v.signer == pins[pkg])
              except Exception as e:
                  bad += 1
                  print("FAIL", pkg, type(e).__name__, e)
          raise SystemExit(1 if bad else 0)
          PY
