name: live-sources
# Manual: downloads real apps from APKPure and APKMirror on a GitHub runner and runs the
# verification chain. Proves the second source works end to end.
on: workflow_dispatch
jobs:
  apkpure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Install apkeep
        run: |
          v=$(cat apkeep.version)
          sudo curl -fsSL -o /usr/local/bin/apkeep "https://github.com/EFForg/apkeep/releases/download/$v/apkeep-x86_64-unknown-linux-gnu"
          sudo chmod +x /usr/local/bin/apkeep
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends apksigner
          apkeep --version; apksigner --version
      - name: apkeep raw output
        continue-on-error: true
        run: |
          O='acknowledge_dangers=true,arch=armeabi-v7a'
          echo "--- list prime (tail)"; apkeep -l -a com.amazon.amazonvideo.livingroom -o arch=armeabi-v7a -d apk-pure 2>&1 | tr ',' '\n' | tail -6
          echo "--- list disney (tail)"; apkeep -l -a com.disney.disneyplus -o arch=armeabi-v7a -d apk-pure 2>&1 | tr ',' '\n' | tail -6
          mkdir -p raw1 raw2 raw3
          echo "--- prime short form"; apkeep -a "com.amazon.amazonvideo.livingroom@v15.5.0.70-armv7a" -d apk-pure -o "$O" raw1 2>&1 | tail -5; ls -la raw1
          echo "--- prime long form"; apkeep -a "com.amazon.amazonvideo.livingroom@6.23.23+v15.5.0.70-armv7a" -d apk-pure -o "$O" raw2 2>&1 | tail -5; ls -la raw2
          echo "--- disney exact"; apkeep -a "com.disney.disneyplus@26.16.0+rc2-2026.09.08" -d apk-pure -o "$O" raw3 2>&1 | tail -5; ls -la raw3
      - name: APKPure download + verify
        run: |
          python - <<'PY'
          from pathlib import Path
          from patcher import apkpure, verify
          out = Path("dl"); out.mkdir(exist_ok=True)
          for pkg, ver in [("com.amazon.amazonvideo.livingroom", "6.23.23+v15.5.0.70-armv7a"),
                           ("com.disney.disneyplus", "26.16.0+rc2-2026.09.08")]:
              try:
                  f = apkpure.download(pkg, ver, out)
                  i = verify.inspect(f)
                  print(pkg, f.name, f.stat().st_size // 1048576, "MB", {k: i[k] for k in ("package", "version", "leanback", "abis", "signer", "apksigner_ok")})
              except Exception as e:
                  print("FAIL", pkg, type(e).__name__, e)
          PY
