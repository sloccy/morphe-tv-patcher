name: live-sources
# Manual: downloads real apps from APKPure and APKMirror on a GitHub runner and runs the
# verification chain. Proves the second source works end to end.
on: workflow_dispatch
jobs:
  apkpure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Install apkeep
        run: |
          v=$(cat apkeep.version)
          sudo curl -fsSL -o /usr/local/bin/apkeep "https://github.com/EFForg/apkeep/releases/download/$v/apkeep-x86_64-unknown-linux-gnu"
          sudo chmod +x /usr/local/bin/apkeep
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends apksigner
          apkeep --version; apksigner --version
      - name: XAPK layout
        continue-on-error: true
        run: |
          mkdir -p lay && for spec in "com.amazon.amazonvideo.livingroom@6.23.23+v15.5.0.70-armv7a" "com.disney.disneyplus@26.16.0+rc2-2026.09.08"; do
            rm -rf lay/*; apkeep -a "$spec" -d apk-pure -o 'acknowledge_dangers=true,arch=armeabi-v7a' lay >/dev/null 2>&1
            f=$(ls lay/*.xapk); echo "=== $spec"; unzip -l "$f" | awk '{print $1, $4}' | grep -v "^ *$" | head -40
            echo "--- manifest.json"; unzip -p "$f" manifest.json | head -c 1800; echo
          done
      - name: APKPure download + verify
        run: |
          python - <<'PY'
          from pathlib import Path
          from patcher import apkpure, verify
          out = Path("dl"); out.mkdir(exist_ok=True)
          # signers recorded from the real APKMirror downloads on 2026-10-22
          pins = {"com.amazon.amazonvideo.livingroom": "2f19adeb284eb36f7f07786152b9a1d14b21653203ad0b04ebbf9c73ab6d7625",
                  "com.disney.disneyplus": "b4d251e979ea974d8f070feb5ab69fc4c2873f4e8add421ff63ad5f2789d63d4"}
          bad = 0
          for pkg, ver in [("com.amazon.amazonvideo.livingroom", "6.23.23+v15.5.0.70-armv7a"),
                           ("com.disney.disneyplus", "26.16.0+rc2-2026.09.08")]:
              try:
                  f = apkpure.download(pkg, ver, out)
                  i = verify.inspect(f)
                  print(pkg, f.name, f.stat().st_size // 1048576, "MB", {k: i[k] for k in ("package", "version", "leanback", "abis", "signer", "apksigner_ok", "apksigner_msg")})
                  v = verify.verify(f, pkg, ver, "apkpure", pins[pkg])
                  print("  VERIFIED against APKMirror signer:", v.signer == pins[pkg])
              except Exception as e:
                  bad += 1
                  print("FAIL", pkg, type(e).__name__, e)
          raise SystemExit(1 if bad else 0)
          PY
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Whole pipeline with APKPure as the only source
        env:
          APKMIRROR_DISABLED: "1"
          DATA_DIR: ${{ runner.temp }}/data
          MORPHE_JAR: ${{ runner.temp }}/morphe.jar
        run: |
          v=$(cat morphe-cli.version)
          curl -fsSL -o "$MORPHE_JAR" "https://github.com/MorpheApp/morphe-cli/releases/download/$v/morphe-desktop-${v#v}-all.jar"
          mkdir -p "$DATA_DIR"
          cat > "$DATA_DIR/state.json" <<'JSON'
          {"com.amazon.amazonvideo.livingroom": {"signer_sha256": "2f19adeb284eb36f7f07786152b9a1d14b21653203ad0b04ebbf9c73ab6d7625"},
           "com.disney.disneyplus": {"signer_sha256": "b4d251e979ea974d8f070feb5ab69fc4c2873f4e8add421ff63ad5f2789d63d4"}}
          JSON
          cat > cfg.yaml <<'YAML'
          device: { host: "10.0.0.1" }
          apkpure: { acknowledge_dangers: true }
          apps:
            - { package: com.amazon.amazonvideo.livingroom, apkmirror: x/y }
            - { package: com.disney.disneyplus, apkmirror: x/y }
          YAML
          python -m patcher once --no-device --config cfg.yaml 2>&1 | grep -E "WARNING|ERROR|patched|Traceback|via " | cut -c1-250
          ls -la "$DATA_DIR/work/output"
  flaresolverr:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Start FlareSolverr
        run: |
          docker run -d --name fs -p 8191:8191 ghcr.io/flaresolverr/flaresolverr:latest
          for i in $(seq 1 30); do curl -sf localhost:8191/health && break; sleep 3; done
      - name: Debug rendered release page
        continue-on-error: true
        run: |
          python - <<'PY'
          from bs4 import BeautifulSoup
          from patcher import flaresolverr
          u = "https://www.apkmirror.com/apk/amazon-mobile-llc/prime-video-android-tv-android-tv/prime-video-android-tv-6-23-23v15-5-0-70-armv7a-release/"
          s = flaresolverr.solve("http://localhost:8191", u)
          print("status", s["status"], "len", len(s["html"]), "ua", s["user_agent"][:60])
          soup = BeautifulSoup(s["html"], "html.parser")
          print("title:", soup.title.string if soup.title else None)
          rows = soup.select("div.table-row.headerFont")
          print("rows:", len(rows))
          for r in rows[:5]: print("ROW:", r.get_text(" ", strip=True)[:200])
          print("BUNDLE mentions:", s["html"].upper().count("BUNDLE"), "| 'variants' mentions:", s["html"].lower().count("variant"))
          import re
          print("table-ish classes:", sorted(set(re.findall(r'class="(table[^"]{0,60})"', s["html"])))[:12])
          PY
      - name: Debug the final download request
        continue-on-error: true
        run: |
          python - <<'PY'
          from curl_cffi import requests as cr
          from patcher import apkmirror as A
          c = A.Client("chrome", "http://localhost:8191")
          c.html(A.BASE + "/")
          rel, rsoup = A.find_release(c, "amazon-mobile-llc/prime-video-android-tv-android-tv", "6.23.23+v15.5.0.70-armv7a")
          variant = A.pick_variant(rsoup, 28)
          dl_page = A.final_link(c.html(variant, referer=rel))
          url = A.file_link(c.html(dl_page, referer=variant))
          print("final url:", url[:110])
          print("cookies from flaresolverr:", sorted(c.cookies))
          print("ua:", c.ua)
          def probe(label, sess, **kw):
              r = sess.get(url, timeout=60, stream=True, **kw)
              head = next(r.iter_content(200), b"")
              print(f"{label}: HTTP {r.status_code} cf-mitigated={r.headers.get('cf-mitigated')} type={r.headers.get('content-type')} body[:60]={head[:60]!r}")
          probe("A fs-cookies+ua+referer (chrome tls)", cr.Session(impersonate="chrome"), headers={"Referer": dl_page, "User-Agent": c.ua}, cookies=c.cookies)
          probe("B fs-cookies+referer, impersonate UA", cr.Session(impersonate="chrome"), headers={"Referer": dl_page}, cookies=c.cookies)
          probe("C no cookies, chrome", cr.Session(impersonate="chrome"), headers={"Referer": dl_page})
          from patcher import flaresolverr
          try:
              sol = flaresolverr.solve("http://localhost:8191", url)
              print("E solve(file url): status", sol["status"], "cookies", sorted(sol["cookies"]), "html len", len(sol["html"]), "title-ish", sol["html"][:80].replace("\n", " "))
              c.cookies.update(sol["cookies"]); c.ua = sol["user_agent"] or c.ua
              probe("F after solving the file url", cr.Session(impersonate="chrome"), headers={"Referer": dl_page, "User-Agent": c.ua}, cookies=c.cookies)
          except Exception as e:
              print("E solve(file url) failed:", type(e).__name__, e)
          PY
      - name: APKMirror through FlareSolverr (Prime Video)
        run: |
          python - <<'PY'
          from pathlib import Path
          from patcher import apkmirror, verify
          out = Path("dl"); out.mkdir(exist_ok=True)
          pkg, ver = "com.amazon.amazonvideo.livingroom", "6.23.23+v15.5.0.70-armv7a"
          try:
              f, how = apkmirror.download("amazon-mobile-llc/prime-video-android-tv-android-tv", ver, 28, out,
                                          flare_url="http://localhost:8191")
              i = verify.inspect(f)
              print("OK", how, f.stat().st_size // 1048576, "MB", i["package"], i["version"], i["leanback"], i["signer"][:16])
          except Exception as e:
              print("FAIL", type(e).__name__, e)
              raise SystemExit(1)
          PY
      - if: always()
        run: docker logs fs 2>&1 | tail -25
