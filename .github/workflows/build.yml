name: Build & Publish

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, master]
  # Rebuilds with no code change (new Morphe release, base image patches) are dispatched
  # weekly by security.yml.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/morphe-tv-patcher

jobs:
  lint:
    name: Lint & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          skip-cache: true  # setup-go above manages the cache

      - name: Run tests
        run: go test -race ./...

  # Which release of each shelled-out tool goes into the image. Resolved once so both
  # architectures get the same versions.
  tools:
    name: Resolve tool versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      morphe: ${{ steps.v.outputs.morphe }}
      morphe_sha256: ${{ steps.v.outputs.morphe_sha256 }}
      date: ${{ steps.v.outputs.date }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "morphe=$(gh api repos/MorpheApp/morphe-cli/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"
          # the jar's checksum as GitHub reports it; the Dockerfile refuses a download that differs
          echo "morphe_sha256=$(gh api repos/MorpheApp/morphe-cli/releases/latest --jq '.assets[] | select(.name | test("desktop-.*-all[.]jar$")) | .digest')" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

  # The boot helper: a tiny Android app that switches Wireless debugging back on after a TV
  # restart. Built with the SDK tools on the runner, then baked into the image.
  bootadb:
    name: Build boot helper
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2 # enough to see what the last commit changed

      # bootadb/version is what lets Android update the helper over the top instead of the app
      # having to be uninstalled, so it has to go up whenever the app changes.
      - name: The helper's version must be bumped when the helper changes
        run: |
          git rev-parse HEAD~1 >/dev/null 2>&1 || exit 0
          app=$(git diff --name-only HEAD~1 HEAD -- bootadb/AndroidManifest.xml bootadb/src)
          ver=$(git diff --name-only HEAD~1 HEAD -- bootadb/version)
          if [ -n "$app" ] && [ -z "$ver" ]; then
            echo "::error::$app changed but bootadb/version did not. Bump it, or every TV has to uninstall the helper to take the update."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      # Signing every build with the same certificate is what lets a TV take the helper as an
      # update instead of having to remove it first. Without the secret the build still works and
      # falls back to a throw-away key, so a fork or a missing secret is not a failure.
      - name: Build and sign the APK
        env:
          BOOTADB_KEYSTORE_B64: ${{ secrets.BOOTADB_KEYSTORE_B64 }}
          BOOTADB_KEYSTORE_PASS: ${{ secrets.BOOTADB_KEYSTORE_PASS }}
        run: |
          if [ -n "${BOOTADB_KEYSTORE_B64:-}" ]; then
            ks=$(mktemp)
            printf %s "$BOOTADB_KEYSTORE_B64" | base64 -d > "$ks"
            export BOOTADB_KEYSTORE="$ks"
          fi
          bootadb/build.sh

      - name: Check the APK is the helper (package, permissions, receiver, version)
        run: BOOTADB_APK="$PWD/bootadb/out/bootadb.apk" go test -count=1 -run TestTheBuiltAPKIsTheHelper -v ./internal/helper

      - name: Keep the APK for the image build
        uses: actions/upload-artifact@v7
        with:
          name: bootadb-apk
          path: bootadb/out/bootadb.apk
          if-no-files-found: error
          retention-days: 3

  # On PRs: compile check only. On pushes: build natively per architecture, push by digest.
  build:
    name: Build ${{ matrix.arch }}
    needs: [lint, tools, bootadb]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        if: github.event_name == 'pull_request'
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Compile check
        if: github.event_name == 'pull_request'
        run: go build ./...

      - name: Get the boot helper APK
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@v8
        with:
          name: bootadb-apk
          path: bootadb/out

      - name: Extract metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=TV Patcher
            org.opencontainers.image.description=Keeps Morphe-patched apps installed on Google TVs

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true  # always check for a newer base image than the cached one
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=linux-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=linux-${{ matrix.arch }}
          build-args: |
            BUILD_VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
            BUILD_COMMIT=${{ github.sha }}
            MORPHE_VERSION=${{ needs.tools.outputs.morphe }}
            MORPHE_SHA256=${{ needs.tools.outputs.morphe_sha256 }}
            TOOLS_REFRESH=${{ needs.tools.outputs.date }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stable aggregate gate for branch protection: require only this check by name ("CI").
  ci:
    name: CI
    needs: [lint, build]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.build.result }}" != "success" ]; then
            echo "A required job did not succeed (lint=${{ needs.lint.result }}, build=${{ needs.build.result }})"
            exit 1
          fi

  # Combines per-arch digests into a multi-arch manifest list and pushes all tags.
  publish:
    name: Publish manifest
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}') \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

  # Starts the published image and exercises the tools it shells out to, so a broken Morphe,
  # adb release is caught here and not on your TV.
  smoke:
    name: Smoke test image
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tools run
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7}"
          docker pull "$IMG"
          docker run --rm "$IMG" version
          docker run --rm --entrypoint java "$IMG" -jar /opt/morphe/morphe.jar --version
          docker run --rm --entrypoint apksigner "$IMG" --version
          docker run --rm --entrypoint ls "$IMG" -l /opt/bootadb/bootadb.apk
          docker run --rm --entrypoint adb "$IMG" version
          # the real Morphe call the patcher makes, against the official patches (no single maintainer to rely on)
          docker run --rm --entrypoint java "$IMG" -jar /opt/morphe/morphe.jar \
            list-versions --patches https://github.com/MorpheApp/morphe-patches -f com.google.android.youtube

      - name: Starts, serves the page and reports healthy
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7}"
          docker run -d --name tp -p 8093:8093 "$IMG"
          for i in $(seq 1 30); do curl -sf localhost:8093/api/health && break; sleep 2; done
          test "$(curl -sf localhost:8093/api/health)" = ok
          curl -sf localhost:8093/ | grep -q "TV Patcher"
          for i in $(seq 1 20); do
            s=$(docker inspect -f '{{.State.Health.Status}}' tp); echo "health: $s"
            [ "$s" = healthy ] && break; sleep 6
          done
          test "$s" = healthy
          docker logs tp | tail -20
