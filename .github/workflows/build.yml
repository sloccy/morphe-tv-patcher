name: build
on:
  push:
    branches: [main]
    paths: [Dockerfile, "patcher/**", requirements.txt, morphe-cli.version, apkeep.version]
  schedule: [{ cron: "30 4 * * 0" }]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && python -m pytest -q tests
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          echo "ver=$(cat morphe-cli.version)" >> "$GITHUB_OUTPUT"
          echo "apkeep=$(cat apkeep.version)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MORPHE_VERSION=${{ steps.v.outputs.ver }}
            APKEEP_VERSION=${{ steps.v.outputs.apkeep }}
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:morphe-${{ steps.v.outputs.ver }}
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
      - name: Smoke test
        run: |
          docker run --rm --entrypoint apkeep ${{ steps.img.outputs.name }}:latest --version
          docker run --rm --entrypoint apksigner ${{ steps.img.outputs.name }}:latest --version
          docker run --rm --entrypoint java ${{ steps.img.outputs.name }}:latest -jar /opt/morphe/morphe.jar --version
          docker run --rm --entrypoint java ${{ steps.img.outputs.name }}:latest -jar /opt/morphe/morphe.jar \
            list-versions --patches https://github.com/ajstrick81/morphe-androidtv-patches
