name: Live checks

# Manual. Runs the published image against the real sites to prove each way of getting an app
# works from a GitHub runner: APKPure (with signer pins), FlareSolverr, and that every app the
# patches support can be found on APKMirror.
on:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/morphe-tv-patcher:latest

jobs:
  apkpure:
    name: APKPure only, whole pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Prepare data with the publisher signers recorded from APKMirror
        run: |
          mkdir -p data/state
          cat > data/state/settings.json <<'JSON'
          {"devices": [], "overrides": {
            "com.amazon.amazonvideo.livingroom": {"signer_sha256": "2f19adeb284eb36f7f07786152b9a1d14b21653203ad0b04ebbf9c73ab6d7625"},
            "com.disney.disneyplus": {"signer_sha256": "b4d251e979ea974d8f070feb5ab69fc4c2873f4e8add421ff63ad5f2789d63d4"}}}
          JSON
          sudo chown -R 65532:65532 data
      - name: Fetch, verify and patch with APKMirror switched off
        run: |
          docker run --rm -v "$PWD/data:/data" \
            -e APKMIRROR_DIRECT_DISABLED=true -e APKPURE_ACKNOWLEDGE_DANGERS=true \
            "$IMAGE" once --no-device --app com.amazon.amazonvideo.livingroom,com.disney.disneyplus

  flaresolverr:
    name: APKMirror through FlareSolverr
    runs-on: ubuntu-latest
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports: ["8191:8191"]
    steps:
      - name: Fetch Prime Video via the sidecar
        run: |
          mkdir -p data && sudo chown 65532:65532 data
          docker run --rm --network host -v "$PWD/data:/data" \
            -e APKMIRROR_DIRECT_DISABLED=true -e FLARESOLVERR_URL=http://127.0.0.1:8191 \
            "$IMAGE" fetch --package com.amazon.amazonvideo.livingroom

  cpu-builds:
    name: CPU-aware builds (Netflix is 32-bit only)
    runs-on: ubuntu-latest
    steps:
      - name: A 32-bit device gets it, an arm64-only device is told there is no build
        run: |
          mkdir -p data && sudo chown 65532:65532 data
          docker run --rm -v "$PWD/data:/data" "$IMAGE" fetch --package com.netflix.ninja --abi armeabi-v7a,armeabi | grep '"abis"' -A2
          if out=$(docker run --rm -v "$PWD/data:/data" "$IMAGE" fetch --package com.netflix.ninja --abi arm64-v8a 2>&1); then
            echo "an arm64-only device must not be given a 32-bit-only app"; exit 1
          fi
          echo "$out" | grep -q "no build for this device"

  second-repository:
    name: A second patch repository (MorpheApp) works
    runs-on: ubuntu-latest
    steps:
      - name: Add the repository and resolve its apps
        run: |
          mkdir -p data/state
          cat > data/state/settings.json <<'JSON'
          {"sources": [{"id": "morpheapp-morphe-patches", "repo": "MorpheApp/morphe-patches", "allow_phone": true}], "devices": []}
          JSON
          sudo chown -R 65532:65532 data
          docker run --rm -v "$PWD/data:/data" "$IMAGE" resolve --source morpheapp-morphe-patches

  resolve:
    name: Every supported app can be found on APKMirror
    runs-on: ubuntu-latest
    steps:
      - name: Resolve (no downloads; Fox One is not on APKMirror, so a MISS for it is expected)
        continue-on-error: true
        run: |
          mkdir -p data && sudo chown 65532:65532 data
          docker run --rm -v "$PWD/data:/data" "$IMAGE" resolve
