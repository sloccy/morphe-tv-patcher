name: bump-morphe
on:
  schedule: [{ cron: "17 5 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        env: { GH_TOKEN: "${{ github.token }}" }
        run: echo "tag=$(gh api repos/MorpheApp/morphe-cli/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"
      - name: Commit bump
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [ "$(cat morphe-cli.version)" != "${{ steps.v.outputs.tag }}" ]; then
            echo "${{ steps.v.outputs.tag }}" > morphe-cli.version
            git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
            git commit -am "chore: bump morphe-cli to ${{ steps.v.outputs.tag }}"
            git push
            gh workflow run build.yml
          fi
