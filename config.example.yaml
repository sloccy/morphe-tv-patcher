device: { host: "192.168.1.50" }   # Google TV picks a random port; found automatically. Optional: port: 41234
schedule: { interval: "6h" }
patches: { repo: ajstrick81/morphe-androidtv-patches, prerelease: false }
morphe: { bytecode_mode: STRIP_SAFE }
alerts: { fetch_failures_before_alert: 3 }   # temporary download problems alert after N failed cycles
apps:
  - package: com.amazon.amazonvideo.livingroom
    apkmirror: amazon-mobile-llc/prime-video-android-tv-android-tv
  - package: com.netflix.ninja
    apkmirror: netflix-inc/netflix-android-tv
    installed_package: com.netflix.ninja.clone   # patched app installs as a clone; stock Netflix stays
  - package: com.disney.disneyplus
    apkmirror: disney/disney-android-tv
    # Optional per app:
    #   sources: [apkmirror, apkpure]   # order; Netflix defaults to apkmirror only
    #   signer_sha256: "<hex>"          # pin the publisher's signing cert (else learned from APKMirror)
