<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Patcher</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='17' rx='3' fill='none' stroke='%232f6fed' stroke-width='3'/%3E%3Cpath d='M10 28h12M16 22v6' stroke='%232f6fed' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5d6671; --line: #dfe3e8;
    --accent: #2f6fed; --accent-text: #ffffff; --ok: #1a7f4b; --bad: #b3261e; --warn: #9a6700; --chip: #eef1f5;
    --bad-bg: #fdecea; --ok-bg: #e8f5ee; --info-bg: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171b; --card: #1d2228; --text: #e8ebef; --muted: #98a2ae; --line: #313840;
      --accent: #6b97ff; --accent-text: #0d1117; --ok: #4cc38a; --bad: #ff8a80; --warn: #e3b341; --chip: #272d34;
      --bad-bg: #3a2220; --ok-bg: #1d3328; --info-bg: #272d34;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 16px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .sec { margin-top: 24px; }
  .sec > .sec-head { margin-bottom: 8px; }
  .sec > .sub { margin: 0 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin-bottom: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row.tight { gap: 4px 8px; }
  .grow { flex: 1 1 auto; min-width: 0; }
  .stack > * + * { margin-top: 8px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 7px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.danger { color: var(--bad); }
  button.x { border: 0; background: none; padding: 0 6px; font-size: 18px; line-height: 1; color: inherit; }
  button:disabled { opacity: .5; cursor: default; }
  input[type=text], select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--text); min-width: 0; }
  select { padding: 3px 6px; font-size: 13px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--muted); margin-right: 6px; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  .chip { background: var(--chip); border-radius: 999px; padding: 1px 8px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .chip.warn { color: var(--warn); }
  .banner { border-radius: 8px; padding: 8px 12px; margin-top: 16px; font-size: 14px; background: var(--bad-bg); color: var(--bad); }
  .note-block { border-radius: 8px; padding: 6px 10px; margin-top: 8px; font-size: 13px; }
  .note-block.error { background: var(--bad-bg); color: var(--bad); }
  .note-block.ok { background: var(--ok-bg); color: var(--ok); }
  .note-block.progress, .note-block.info { background: var(--info-bg); color: var(--muted); }
  .note-block ul { margin: 4px 0 0; padding-left: 18px; }
  .note-block .unchecked { margin-top: 4px; color: var(--muted); }
  .steps { margin: 0; padding-left: 20px; }
  .steps li { padding: 2px 0; }
  .steps li.done { color: var(--muted); text-decoration: line-through; }
  .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 4px 16px; margin: 8px 0; }
  .app { display: flex; gap: 8px; align-items: flex-start; padding: 4px 8px; border-radius: 7px; }
  .app:hover { background: var(--chip); }
  .app input { margin-top: 4px; }
  .app label { cursor: pointer; display: block; }
  .app.locked { opacity: .75; }
  .meta { color: var(--muted); font-size: 12.5px; display: block; }
  .checks { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 4px 0; }
  .checks label { cursor: pointer; font-size: 14px; }
  .list { margin: 8px 0 0; padding-left: 18px; font-size: 13px; }
  .list .bad { color: var(--bad); } .list .ok { color: var(--ok); } .list .warn { color: var(--warn); }
  .src { padding: 8px 0; border-top: 1px solid var(--line); }
  .src:first-child { border-top: 0; padding-top: 0; }
  .warnbox { border: 1px solid var(--warn); border-radius: 8px; padding: 8px 12px; margin-top: 12px; font-size: 13px; }
  details > summary { cursor: pointer; padding: 4px 0; }
  details.sub-details { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 4px; }
  details.set { border-top: 1px solid var(--line); padding: 4px 0; }
  details.set:first-of-type { border-top: 0; }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; overflow: auto; max-height: 320px; font-size: 12px; }
  .empty { color: var(--muted); text-align: center; padding: 24px 8px; }
  .gap-top { margin-top: 8px; }
  .stepline { margin-top: 8px; font-size: 13px; color: var(--accent); }
  .reachline { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .reachline.bad { color: var(--bad, #c0392b); }
</style>
</head>
<body>
<main>
  <div id="app"></div>
  <details class="card sec" id="logbox">
    <summary>Log</summary>
    <pre id="log">(open to load)</pre>
  </details>
</main>

<script>
"use strict";

// ---- state ----
// server: the last /api/state. drafts: edits not saved yet, kept only while they differ from the
// server. fields: every typed value, so a redraw never loses it. messages: one line per scope.
let server = null;
const drafts = { dev: {}, set: {}, patches: {} };   // dev[id] = {apps?: Map, sets?: Set}; set[id|"__new"] = {name, apps: Map, devices: Set}
const fields = {};                     // input id -> string | boolean
const messages = {};                   // scope -> {kind: progress|ok|error|info, text, problems, unchecked, at}
const busy = new Set();                // keys of actions still running
const ui = { open: loadOpen(), pair: {}, mkset: {}, creatingSet: false };
let focusId = null;                    // element to focus after the next draw
let stamp = 0, lastText = "", seq = 0, applied = 0, fails = 0, pageBroken = false, pollTimer = null;

function loadOpen() { try { return JSON.parse(localStorage.getItem("ui-open") || "{}"); } catch (e) { return {}; } }
function saveOpen() { try { localStorage.setItem("ui-open", JSON.stringify(ui.open)); } catch (e) { /* private mode: fine */ } }

window.addEventListener("error", () => { pageBroken = true; safeRender(); });
window.addEventListener("unhandledrejection", () => { pageBroken = true; safeRender(); });

// ---- helpers ----
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (k === "value") el.value = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
  return el;
}

async function api(method, path, body) {
  const opt = { method, headers: {} };
  if (body !== undefined || method === "POST" || method === "PUT") {
    opt.headers["Content-Type"] = "application/json";
    opt.body = JSON.stringify(body === undefined ? {} : body);
  }
  const r = await fetch(path, opt);
  let data = {};
  try { data = await r.json(); } catch (e) { /* empty body */ }
  if (!r.ok) { const e = new Error(data.error || ("The server answered HTTP " + r.status)); e.data = data; throw e; }
  return data;
}

function when(iso) {
  if (!iso || iso.startsWith("0001")) return "";
  return new Date(iso).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}
const plural = (n, one, many) => n + " " + (n === 1 ? one : many);
const mapEq = (a, b) => a.size === b.size && [...a].every(([k, v]) => b.get(k) === v);
const setEq = (a, b) => a.size === b.size && [...a].every(v => b.has(v));
const toChoices = m => [...m].map(([pkg, src]) => ({ package: pkg, source: src }));
const choiceMap = list => new Map((list || []).map(c => [c.package, c.source]));

const sourceById = id => (server.sources || []).find(s => s.id === id);
const setById = id => (server.sets || []).find(x => x.id === id);
const deviceById = id => (server.devices || []).find(x => x.id === id);

// ---- messages: one line per scope, replaced by the next action in that scope ----
function say(scope, kind, text, extra) {
  const m = { kind, text, problems: (extra && extra.problems) || [], unchecked: (extra && extra.unchecked) || [], at: ++stamp };
  messages[scope] = m;
  if (kind === "ok" && !m.problems.length && !m.unchecked.length && !(extra && extra.sticky)) {
    setTimeout(() => { if (messages[scope] && messages[scope].at === m.at) { delete messages[scope]; safeRender(); } }, 6000);
  }
}
function msgLine(scope) {
  const m = messages[scope];
  if (!m) return null;
  return h("div", { class: "note-block " + m.kind, role: m.kind === "error" ? "alert" : "status" },
    h("div", { class: "row" },
      h("span", { class: "grow" }, m.text),
      m.kind === "progress" ? null : h("button", { class: "x", type: "button", id: "x-" + scope, "aria-label": "Dismiss", onclick: () => { delete messages[scope]; render(); } }, "×")),
    m.problems.length ? h("ul", {}, m.problems.map(p => h("li", {}, p.device + ": " + p.reason))) : null,
    m.unchecked.length ? h("div", { class: "unchecked" }, "Not checked: " + m.unchecked.join("; ")) : null);
}

// Run one action at a time per key. It reports into one scope, and the page is reloaded once at the end.
async function act({ key, scope, progress, run, ok, sticky }) {
  if (busy.has(key)) return;
  busy.add(key);
  if (progress) say(scope, "progress", progress); else delete messages[scope];
  safeRender();
  try {
    const r = await run();
    const text = typeof ok === "function" ? ok(r) : ok;
    if (text) say(scope, "ok", text, { unchecked: r && r.unchecked, sticky }); else delete messages[scope];
  } catch (e) {
    say(scope, "error", e.message, e.data);
  } finally {
    busy.delete(key);
    await load(true);
  }
}

// ---- drafts ----
const serverApps = dev => choiceMap(dev.apps);
const selection = dev => (drafts.dev[dev.id] && drafts.dev[dev.id].apps) || serverApps(dev);
const deviceSets = dev => (drafts.dev[dev.id] && drafts.dev[dev.id].sets) || new Set(dev.sets || []);
const isDirty = dev => !!drafts.dev[dev.id];

function editDevice(dev, key, value) {
  const base = key === "apps" ? serverApps(dev) : new Set(dev.sets || []);
  const same = key === "apps" ? mapEq(value, base) : setEq(value, base);
  const d = drafts.dev[dev.id] || (drafts.dev[dev.id] = {});
  if (same) delete d[key]; else d[key] = value;
  if (!d.apps && !d.sets) delete drafts.dev[dev.id];
  render();
}

function setView(st) {
  return drafts.set[st.id] || { name: st.name, apps: choiceMap(st.apps), devices: new Set(st.devices || []) };
}
function editSet(st, change) {
  const d = drafts.set[st.id] || (drafts.set[st.id] = setView(st));
  change(d);
  render();
}

// after each load: forget drafts and messages for things that are gone, and drafts that match the server again
function prune() {
  for (const id of Object.keys(drafts.dev)) {
    const dev = deviceById(id);
    if (!dev) { delete drafts.dev[id]; continue; }
    const d = drafts.dev[id];
    if (d.apps && mapEq(d.apps, serverApps(dev))) delete d.apps;
    if (d.sets && setEq(d.sets, new Set(dev.sets || []))) delete d.sets;
    if (!d.apps && !d.sets) delete drafts.dev[id];
  }
  for (const id of Object.keys(drafts.set)) {
    if (id === "__new") continue;
    const st = setById(id);
    if (!st) { delete drafts.set[id]; continue; }
    const d = drafts.set[id];
    if (d.name === st.name && mapEq(d.apps, choiceMap(st.apps)) && setEq(d.devices, new Set(st.devices || []))) delete drafts.set[id];
  }
  for (const pkg of Object.keys(drafts.patches)) {
    const app = (server.apps || []).find(a => a.package === pkg);
    if (!app || setEq(drafts.patches[pkg], patchesChecked(pkg, allPatchesFor(app)))) delete drafts.patches[pkg];
  }
  for (const scope of Object.keys(messages)) {
    const [kind, id] = scope.split(":");
    if ((kind === "device" && !deviceById(id)) || (kind === "set" && id !== "__new" && !setById(id))) delete messages[scope];
  }
}

// ---- loading: the newest answer wins; a slow old one is ignored ----
async function load(force) {
  const mine = ++seq;
  try {
    const r = await fetch("/api/state", { cache: "no-cache" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const text = await r.text();
    if (mine < applied) return;
    applied = mine;
    const wasDown = fails >= 2;
    fails = 0;
    if (force || wasDown || text !== lastText) {
      server = JSON.parse(text); lastText = text;
      prune();
      safeRender();
    }
  } catch (e) {
    fails++;
    if (fails === 2) safeRender();
  }
  schedule();
}
function schedule() {
  clearTimeout(pollTimer);
  const active = server && ((server.status && server.status.running) || (server.learning && (server.learning.pending || []).length));
  pollTimer = setTimeout(refresh, document.hidden ? 30000 : (active ? 1500 : 3000));
}
async function refresh() {
  await load(false);
  if (document.getElementById("logbox").open) loadLog();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

async function loadLog() {
  try {
    const l = await api("GET", "/api/log");
    const pre = document.getElementById("log");
    const text = l.lines.join("\n") || "(empty)";
    if (pre.textContent !== text) { pre.textContent = text; pre.scrollTop = pre.scrollHeight; }
  } catch (e) { /* the connection banner covers this */ }
}

// ---- inputs whose text lives in `fields` ----
function textField(id, label, placeholder, extra) {
  return h("input", Object.assign({ type: "text", id, "aria-label": label, placeholder, autocomplete: "off",
    value: typeof fields[id] === "string" ? fields[id] : "",
    oninput: ev => { fields[id] = ev.target.value; } }, extra || {}));
}
function checkField(id, text) {
  return h("label", { class: "sub" }, h("input", { type: "checkbox", id, checked: !!fields[id], onchange: ev => { fields[id] = ev.target.checked; } }), " " + text);
}

// ---- app grid, shared by devices and sets ----
const defaultSource = () => (server.sources || [])[0];
function pickSource(app, wanted) {
  if (wanted && app.sources.some(s => s.id === wanted)) return wanted;
  const def = defaultSource();
  if (def && app.sources.some(s => s.id === def.id)) return def.id;
  return app.sources[0].id;
}
function planChip(p) {
  const text = { current: "up to date", update: "update to " + p.target, new: "new install", patches: "new patches",
    rollback: "goes back to " + p.target, blocked: "blocked" }[p.kind];
  const title = { current: "Nothing to do on the next run", update: "The next run installs this version", new: "The next run installs it",
    patches: "Newer patches exist. The next run rebuilds it and reinstalls it only if the patched app changed. Code the patches share between apps counts, even when the change was meant for another app",
    rollback: "The installed app is newer, so the next run uninstalls it first (you log in again)",
    blocked: "The installed app is newer and uninstalling is turned off for it" }[p.kind];
  return text ? h("span", { class: "chip" + (p.kind === "rollback" || p.kind === "blocked" ? " warn" : ""), title }, text) : null;
}
// sel: Map(package -> source id). locked: Map(package -> set name) for apps a TV gets from a set.
function appGrid(prefix, sel, installs, locked, onChange, plan) {
  const apps = server.apps || [];
  if (!apps.length) return h("div", { class: "sub gap-top" }, "No apps yet. Add a patch repository under Patch sources.");
  return h("div", { class: "apps" }, apps.map(a => {
    const chosen = sel.get(a.package);
    const src = a.sources.find(s => s.id === pickSource(a, chosen)) || a.sources[0];
    const srcInfo = sourceById(src.id) || {};
    const inst = (installs || {})[a.package];
    const lock = locked && locked.get(a.package);
    const pl = plan && plan[a.package];
    const id = prefix + "-" + a.package;
    return h("div", { class: "app" + (lock ? " locked" : "") },
      h("input", { type: "checkbox", id, checked: sel.has(a.package) || !!lock, disabled: !!lock, onchange: ev => {
        const m = new Map(sel);
        ev.target.checked ? m.set(a.package, pickSource(a, chosen)) : m.delete(a.package);
        onChange(m);
      } }),
      h("span", { class: "grow" },
        h("label", { for: id }, a.name, " ",
          lock ? h("span", { class: "chip" }, "from " + lock) : null, " ",
          pl ? planChip(pl) : null, " ",
          src.experimental ? h("span", { class: "chip warn" }, "experimental") : null, " ",
          srcInfo.allow_phone ? h("span", { class: "chip warn", title: "A phone app: it may install but not show in the TV launcher" }, "phone app") : null),
        h("span", { class: "meta" }, "target " + src.target + (inst ? " · installed " + inst.apk_version + " (" + when(inst.installed_at) + ")" : "")),
        !lock && a.sources.length > 1 ? h("span", { class: "meta" }, "patches from ",
          h("select", { id: "sel-" + id, "aria-label": "Patch source for " + a.name, onchange: ev => { const m = new Map(sel); m.set(a.package, ev.target.value); onChange(m); } },
            a.sources.map(s => h("option", { value: s.id, selected: s.id === src.id }, (sourceById(s.id) || {}).repo || s.id)))) : null));
  }));
}

// <details> that remembers whether the user opened it. forceOpen keeps it open while there is unsaved work.
function det(key, defaultOpen, forceOpen, attrs, summary, ...kids) {
  const current = () => (key in ui.open ? ui.open[key] : defaultOpen);
  return h("details", Object.assign({ open: forceOpen || current(), ontoggle: ev => {
    if (!forceOpen && ev.target.open !== current()) { ui.open[key] = ev.target.open; saveOpen(); }
  } }, attrs || {}), h("summary", {}, summary), kids);
}

// ---- devices ----
function appsSummary(dev) {
  const eff = dev.effective || [];
  const own = eff.filter(e => !e.via || !e.via.startsWith("set:")).length;
  const bySet = {};
  for (const e of eff) if (e.via && e.via.startsWith("set:")) { const n = (setById(e.via.slice(4)) || {}).name || "a set"; bySet[n] = (bySet[n] || 0) + 1; }
  const parts = Object.entries(bySet).map(([n, c]) => c + " from " + n);
  if (own) parts.push(own + " extra");
  return h("span", {}, h("strong", {}, "Apps: " + eff.length), parts.length ? " (" + parts.join(", ") + ")" : " (none chosen yet)");
}

// How the server could reach this TV the last time it looked (every few minutes, without
// connecting, so the TV shows no notice).
function reachLine(dev) {
  const rc = server.status && server.status.reach && server.status.reach[dev.id];
  if (!rc) return null;
  const since = rc.since && !rc.since.startsWith("0001") ? " since " + when(rc.since) : "";
  const restored = rc.restored && !rc.restored.startsWith("0001") ? " · fixed port restored " + when(rc.restored) : "";
  if (rc.state === "fixed") return h("div", { class: "reachline" }, "Reachable on fixed port " + rc.port + restored);
  if (rc.state === "wireless") return h("div", { class: "reachline" + (rc.note ? " bad" : "") },
    "Reachable on Wireless debugging port " + rc.port + restored + (rc.note ? " · could not put the fixed port back: " + rc.note : ""));
  return h("div", { class: "reachline bad" }, "Not answering" + since + ". If the TV is on, Wireless debugging is off: turn it on in Developer options and tick “Always allow on this network”.");
}

function deviceCard(dev) {
  const scope = "device:" + dev.id;
  const sel = selection(dev);
  const sets = deviceSets(dev);
  const dirty = isDirty(dev);
  const last = dev.last || [];
  const offline = last.some(r => !r.ok && !r.package);
  const failed = last.filter(r => !r.ok).length;
  const warnings = (server.warnings || []).filter(w => w.device === dev.name);

  const locked = new Map();
  for (const sid of sets) { const st = setById(sid); if (st) for (const c of st.apps || []) if (!sel.has(c.package) && !locked.has(c.package)) locked.set(c.package, st.name); }

  const grid = appGrid("c-" + dev.id, sel, dev.installs, locked, m => editDevice(dev, "apps", m), dev.plan);
  const nameOf = pkg => ((server.apps || []).find(a => a.package === pkg) || {}).name || pkg;
  const planNotes = Object.entries(dev.plan || {}).filter(([, p]) => p.kind === "rollback" || p.kind === "blocked").map(([pkg, p]) => h("li", { class: p.kind === "rollback" ? "warn" : "bad" },
    p.kind === "rollback"
      ? nameOf(pkg) + ": Run now uninstalls it first to go back to " + p.target + " (you will have to log in again)."
      : nameOf(pkg) + ": the TV has " + p.from + ", newer than " + p.target + ". Uninstalling is turned off for this app: uninstall it on the TV or remove allow_uninstall=false in settings.json."));
  const step = server.status && server.status.running && server.status.steps && server.status.steps[dev.id];
  const setChecks = (server.sets || []).length ? h("div", {},
    h("div", { class: "sub" }, "App sets for this TV"),
    h("div", { class: "checks" }, server.sets.map(st => h("label", {},
      h("input", { type: "checkbox", id: "ds-" + dev.id + "-" + st.id, checked: sets.has(st.id), onchange: ev => {
        const next = new Set(sets);
        ev.target.checked ? next.add(st.id) : next.delete(st.id);
        editDevice(dev, "sets", next);
      } }), " " + st.name + " (" + (st.apps || []).length + ")")))) : null;

  const paired = dev.info && dev.info.paired_at;
  const info = dev.info || {};
  const cpu = info.abis && info.abis.length
    ? h("span", { class: "chip", title: "What the device reports; builds are chosen to match" }, (dev.is64 ? "64-bit capable" : "32-bit") + " · " + info.abis.join(", ") + " · Android API " + info.sdk) : null;

async function doSave(dev) {
  await act({ key: "save-" + dev.id, scope: "device:" + dev.id, run: async () => {
    let unchecked = [];
    const d = drafts.dev[dev.id] || {};
    if (d.sets) {
      const r = await api("PUT", "/api/devices/" + encodeURIComponent(dev.id) + "/sets", { sets: [...d.sets] });
      unchecked = unchecked.concat(r.unchecked || []);
      delete d.sets;
    }
    if (d.apps) {
      const r = await api("PUT", "/api/devices/" + encodeURIComponent(dev.id) + "/apps", { apps: toChoices(d.apps) });
      unchecked = unchecked.concat(r.unchecked || []);

    if (!d.apps && !d.sets) delete drafts.dev[dev.id];
    return { unchecked };

// The TV advertises its pairing port while the dialog is open, so it does not have to be typed.
async function findPairPort(dev) {
  try {
    const r = await api("GET", "/api/devices/" + encodeURIComponent(dev.id) + "/pairport");
    if (!ui.pair[dev.id] || fields["pp-" + dev.id]) return;
    if (r.port > 0) { fields["pp-" + dev.id] = String(r.port); focusId = "pc-" + dev.id; render(); }
    else { messages["device:" + dev.id] = { kind: "info", text: "Nothing is advertising a pairing port yet. Open “Pair device with pairing code” on the TV, or type the port from that screen.", problems: [], unchecked: [], at: ++stamp }; render(); }
  } catch (e) { /* typing it in still works */ }
}

async function doPair(dev) {
  // Take what the TV screen shows: the port as "10.0.0.7:37123", and a code some firmware spaces out as "123 456".
  const raw = (fields["pp-" + dev.id] || "").trim();
  const port = parseInt(raw.includes(":") ? raw.slice(raw.lastIndexOf(":") + 1) : raw, 10);
  const code = (fields["pc-" + dev.id] || "").replace(/\D/g, "");
  const scope = "device:" + dev.id;
  if (!(port >= 1024 && port <= 65535)) {
    say(scope, "error", "Enter the pairing port from the TV's “Pair device with pairing code” screen (1024-65535)" + (raw ? ", not “" + raw + "”" : "") + ".");
    focusId = "pp-" + dev.id; render(); return;
  }
  if (code.length !== 6) {
    say(scope, "error", "Enter the six-digit code the TV is showing.");
    focusId = "pc-" + dev.id; render(); return;
  }
  await act({ key: "pair-" + dev.id, scope, progress: "Pairing…", run: async () => {
    const r = await api("POST", "/api/devices/" + encodeURIComponent(dev.id) + "/pair", { pair_port: port, code });
    ui.pair[dev.id] = false; delete fields["pp-" + dev.id]; delete fields["pc-" + dev.id];
    return r;
  }, ok: r => r.message, sticky: true });
}

async function doRemove(dev) {
  if (!confirm("Remove " + dev.name + "? Nothing is uninstalled from the TV.")) return;
  await act({ key: "rm-" + dev.id, scope: "device:" + dev.id, run: () => api("DELETE", "/api/devices/" + encodeURIComponent(dev.id)) });

// ---- app patches ----
// The patches an app has: its own (merged by name across the sources it is in), then the ones that fit any app.
function ownPatches(app) {
  const m = new Map();
  for (const src of app.sources) for (const p of src.patches || []) if (!m.has(p.name)) m.set(p.name, p);
  return [...m.values()];
}
function universalPatches() {
  const m = new Map();
  for (const list of Object.values(server.universal || {})) for (const p of list) if (!m.has(p.name)) m.set(p.name, p);
  return [...m.values()];
}
function allPatchesFor(app) {
  const own = ownPatches(app), names = new Set(own.map(p => p.name));
  return own.concat(universalPatches().filter(p => !names.has(p.name)));
}
// the names that are on right now according to the server: defaults, minus the switched off, plus the switched on
function patchesChecked(pkg, all) {
  const c = (server.patch_choice || {})[pkg] || { enable: [], disable: [] };
  const on = new Set();
  for (const p of all) if ((p.default && !c.disable.includes(p.name)) || c.enable.includes(p.name)) on.add(p.name);
  return on;
}
function patchApp(app) {
  const pkg = app.package, scope = "patches:" + pkg;
  const own = ownPatches(app), all = allPatchesFor(app), ownNames = new Set(own.map(p => p.name));
  const draft = drafts.patches[pkg];
  const checked = draft || patchesChecked(pkg, all);
  const hasChoice = !!(server.patch_choice || {})[pkg];
  const saving = busy.has("patches-" + pkg);
  const toggle = (p, on) => {
    const next = new Set(checked);
    on ? next.add(p.name) : next.delete(p.name);
    if (setEq(next, patchesChecked(pkg, all))) delete drafts.patches[pkg]; else drafts.patches[pkg] = next;
    render();
  };
  const row = p => {
    const id = "pt-" + pkg + "-" + all.indexOf(p);
    return h("div", { class: "app" },
      h("input", { type: "checkbox", id, checked: checked.has(p.name), onchange: ev => toggle(p, ev.target.checked) }),
      h("span", { class: "grow" },
        h("label", { for: id }, p.name, " ", p.default ? null : h("span", { class: "chip warn" }, "optional")),
        p.description ? h("span", { class: "meta" }, p.description) : null));
  };
  const universal = all.filter(p => !ownNames.has(p.name));
  const onCount = own.filter(p => checked.has(p.name)).length;
  return det("patches:" + pkg, false, !!draft || saving || (messages[scope] && messages[scope].kind === "error"), { class: "set" },
    h("span", {}, h("strong", {}, app.name), " · " + onCount + " of " + own.length + " patches on" + (hasChoice || draft ? " (changed from the defaults)" : "")),
    h("div", { class: "sub gap-top" }, "Applies to " + app.name + " on every TV that gets it."),
    h("div", { class: "apps" }, own.map(row)),
    universal.length ? det("univ:" + pkg, false, universal.some(p => checked.has(p.name)) && !!draft, { class: "sub-details" },
      "Patches for any app (" + universal.length + ")", h("div", { class: "apps" }, universal.map(row))) : null,
    h("div", { class: "row" },
      h("button", { class: "primary", id: "savepatches-" + pkg, disabled: !draft || saving, onclick: () => doSavePatches(app, all) }, saving ? "Saving…" : "Save patches"),
      h("button", { id: "resetpatches-" + pkg, disabled: (!hasChoice && !draft) || saving, onclick: () => doResetPatches(app) }, "Reset to defaults"),
      h("span", { class: "sub" }, "The next run rebuilds " + app.name + " and reinstalls it only if the result changed.")),
    msgLine(scope));
}

function patchesSection() {
  const used = new Set();
  for (const dev of server.devices || []) for (const e of dev.effective || []) used.add(e.package);
  const apps = (server.apps || []).filter(a => used.has(a.package) && ownPatches(a).length);

async function savePatchChoice(app, enable, disable) {
  await act({ key: "patches-" + app.package, scope: "patches:" + app.package, progress: "Saving…", run: async () => {

async function doSavePatches(app, all) {
  const checked = drafts.patches[app.package];
  if (!checked) return;
  await savePatchChoice(app,
    all.filter(p => !p.default && checked.has(p.name)).map(p => p.name),
    all.filter(p => p.default && !checked.has(p.name)).map(p => p.name));
}
async function doResetPatches(app) {
  if (!(server.patch_choice || {})[app.package]) { delete drafts.patches[app.package]; render(); return; }
  await savePatchChoice(app, [], []);
}

    h("div", { class: "row" },
      h("div", { class: "grow" },
        h("h1", {}, "TV Patcher"),
        h("div", { class: "sub" }, "patches " + (tags.length ? tags.join(" · ") : (st.patches_version || "?")) + " · " + lastRun + (server.version ? " · " + server.version : ""))),
      h("label", { class: "sub" }, h("input", { type: "checkbox", id: "force", checked: !!fields.force, onchange: ev => { fields.force = ev.target.checked; } }), " reinstall everything"),
      h("button", { class: "primary", id: "runall", disabled: !!st.running || busy.has("run-"), onclick: () => doRun("") }, st.running ? "Running…" : "Run now")),
    learning ? h("div", { class: "sub gap-top" }, learning) : null,
    msgLine("run"));
}

function gettingStarted() {
  const devs = server.devices || [];
  const steps = [
    ["Add a patch repository under Patch sources.", (server.sources || []).length > 0],
    ["Add your TV under Devices.", devs.length > 0],
    ["Press Pair… on its card and follow the prompt.", devs.some(d => d.info && d.info.paired_at)],
    ["Tick apps and press Save.", devs.some(d => (d.effective || []).length > 0)],
  ];
  if (steps.every(s => s[1])) return null;
  return h("section", { class: "card sec" },
    h("h2", { class: "sec-head" }, "Getting started"),
    h("ol", { class: "steps" }, steps.map(([text, done]) => h("li", { class: done ? "done" : "" }, text))),
    h("div", { class: "sub gap-top" }, "Then press Run now. Saving never installs anything; installs happen on a run."));
}

async function doSaveAll() {
  for (const dev of (server.devices || []).filter(isDirty)) await doSave(dev);
}

function devicesSection() {
  const devs = server.devices || [];
  const dirtyCount = devs.filter(isDirty).length;
  return h("section", { class: "sec" },
    h("div", { class: "row sec-head" },
      h("h2", { class: "grow" }, "Devices"),
      dirtyCount > 1 ? h("button", { class: "primary", id: "saveall", disabled: devs.some(d => busy.has("save-" + d.id)), onclick: doSaveAll }, "Save all (" + dirtyCount + ")") : null),
    devs.length ? devs.map(deviceCard) : h("div", { class: "card empty" }, "No devices yet. Add one below."),
    h("div", { class: "card" },
      h("strong", {}, "Add a device"),
      h("div", { class: "sub" }, "Turn on Developer options → Wireless debugging on the TV, then enter its IP address. Give the TV a fixed IP in your router."),
      h("div", { class: "row gap-top" },
        textField("newname", "Device name", "Name (Living room)", { maxlength: 60 }),
        textField("newhost", "IP address", "IP address (10.0.0.6)", { maxlength: 253 }),
        h("button", { id: "adddev", disabled: busy.has("adddev"), onclick: doAddDevice }, busy.has("adddev") ? "Adding…" : "Add")),
      msgLine("add-device")));
}

async function doNotifyTest() {
  await act({ key: "notify", scope: "notify", progress: "Sending…", run: () => api("POST", "/api/notify/test"), ok: r => r.message, sticky: true });
}

function notifySection() {
  const on = !!(server.notify && server.notify.configured);
  return h("section", { class: "card sec" },
    h("div", { class: "row" },
      h("div", { class: "grow" },
        h("strong", {}, "Notifications"),
        h("div", { class: "sub" }, on ? "Telegram is on. You get a message after runs that update an app or hit a problem."
          : "Telegram is off. Set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID and restart to get messages after runs.")),
      on ? h("button", { id: "notifytest", disabled: busy.has("notify"), onclick: doNotifyTest }, busy.has("notify") ? "Sending…" : "Send test message") : null),
    msgLine("notify"));
}

function build() {
  return [
    headerBlock(),
    fails >= 2 ? h("div", { class: "banner", role: "alert" }, "Can't reach TV Patcher. Retrying every few seconds.") : null,
    pageBroken ? h("div", { class: "banner", role: "alert" }, "Something broke on this page. Reload it.") : null,
    gettingStarted(),
    devicesSection(),
    setsSection(),
    patchesSection(),
    sourcesSection(),
    notifySection(),
  ];
}

// Always redraw everything, then put focus, caret and scroll back, so typing is never lost.
function render() {
  if (!server) return;
  const app = document.getElementById("app");
  const ae = document.activeElement;
  const inApp = ae && ae.id && app.contains(ae);
  const fid = focusId || (inApp ? ae.id : null);
  const caret = inApp && ae.id === fid && typeof ae.selectionStart === "number" ? [ae.selectionStart, ae.selectionEnd] : null;
  const y = window.scrollY;
  app.replaceChildren(...build().filter(Boolean));
  if (fid) {
    const e = document.getElementById(fid);
    if (e) {
      e.focus({ preventScroll: true });
      if (caret) { try { e.setSelectionRange(caret[0], caret[1]); } catch (err) { /* inputs without a caret */ } }
    }
  }
  focusId = null;
  window.scrollTo(0, y);
}
function safeRender() { try { render(); } catch (e) { pageBroken = true; console.error(e); } }

window.addEventListener("beforeunload", ev => {
  const n = drafts.set.__new;
  const unsaved = Object.keys(drafts.dev).length || Object.keys(drafts.patches).length || Object.keys(drafts.set).some(k => k !== "__new") || (n && (n.name || n.apps.size));
  if (unsaved) { ev.preventDefault(); ev.returnValue = ""; }
});
document.getElementById("logbox").addEventListener("toggle", ev => { if (ev.target.open) loadLog(); });
load(true);
</script>
</body>
