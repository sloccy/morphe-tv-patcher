<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Patcher</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5d6671; --line: #dfe3e8;
    --accent: #2f6fed; --accent-text: #ffffff; --ok: #1a7f4b; --bad: #b3261e; --warn: #9a6700; --chip: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171b; --card: #1d2228; --text: #e8ebef; --muted: #98a2ae; --line: #313840;
      --accent: #6b97ff; --accent-text: #0d1117; --ok: #4cc38a; --bad: #ff8a80; --warn: #e3b341; --chip: #272d34;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .grow { flex: 1 1 auto; min-width: 0; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 7px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  input[type=text], input[type=number], select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--text); min-width: 0; }
  select { padding: 3px 6px; font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--muted); margin-right: 6px; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 14px; margin: 12px 0; }
  .app { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border-radius: 7px; }
  .app:hover { background: var(--chip); }
  .app input { margin-top: 3px; }
  .app label { cursor: pointer; display: block; }
  .meta { color: var(--muted); font-size: 12.5px; display: block; }
  .chip { background: var(--chip); border-radius: 999px; padding: 1px 8px; font-size: 12px; color: var(--muted); margin-left: 6px; white-space: nowrap; }
  .chip.warn { color: var(--warn); }
  .msg { font-size: 13px; margin: 6px 0 0; }
  .msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
  .results { font-size: 13px; color: var(--muted); margin: 4px 0 0; padding-left: 18px; }
  .results .bad { color: var(--bad); } .results .ok { color: var(--ok); }
  .src { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
  .src:first-of-type { border-top: 0; }
  .warnbox { border: 1px solid var(--warn); border-radius: 8px; padding: 8px 10px; margin-top: 10px; font-size: 13px; }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow: auto; max-height: 320px; font-size: 12px; }
  details summary { cursor: pointer; color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 24px 8px; }
  .setbox { border-top: 1px solid var(--line); padding: 12px 0; }
  .setbox:first-of-type { border-top: 0; }
  .problems { margin: 6px 0 0; padding-left: 18px; font-size: 13px; color: var(--bad); }
  .note { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .checks { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 6px 0; }
  .checks label { cursor: pointer; font-size: 14px; }
  .app.locked { opacity: .75; }
  details.setbox summary { padding: 2px 0; }
  .seted { padding-top: 8px; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>TV Patcher</h1>
      <div class="sub" id="sub">loading…</div>
    </div>
    <div class="row">
      <label class="sub"><input type="checkbox" id="force"> reinstall everything</label>
      <button class="primary" id="runall">Run now</button>
    </div>
  </header>

  <div id="devices"></div>

  <section class="card" id="sets"></section>

  <section class="card" id="sources"></section>

  <section class="card">
    <strong>Add a device</strong>
    <div class="sub">Turn on Developer options → Wireless debugging on the TV, then enter its IP address. Give the TV a fixed IP in your router.</div>
    <div class="row" style="margin-top:8px">
      <input type="text" id="newname" placeholder="Name (Living room)" maxlength="60">
      <input type="text" id="newhost" placeholder="IP address (10.0.0.6)" maxlength="253">
      <button id="adddev">Add</button>
    </div>
    <div class="msg" id="addmsg"></div>
  </section>

  <details class="card" id="logbox">
    <summary>Log</summary>
    <pre id="log">(open to load)</pre>
  </details>
</main>

<script>
"use strict";
let state = null;
const dirty = {};      // device id -> Map(package -> patch source id), unsaved changes
const openPair = {};   // device id -> true while the pairing form is open
const notes = {};      // device id -> {text, ok, problems, unchecked}
const dirtySets = {};  // device id -> Set of app-set ids not yet saved
const setDraft = {};   // set id (or "__new") -> {name, apps: Map, devices: Set}
const setNotes = {};   // set id -> {text, ok, problems, unchecked}
const setOpen = {};    // set id -> true while its editor is expanded
let sourceNote = null; // {text, ok}

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
  return el;
}

async function api(method, path, body) {
  const opt = { method, headers: {} };
  if (body !== undefined || method === "POST" || method === "PUT") {
    opt.headers["Content-Type"] = "application/json";
    opt.body = JSON.stringify(body === undefined ? {} : body);
  }
  const r = await fetch(path, opt);
  let data = {};
  try { data = await r.json(); } catch (e) { /* empty body */ }
  if (!r.ok) { const e = new Error(data.error || ("HTTP " + r.status)); e.data = data; e.status = r.status; throw e; }
  return data;
}

// a note for the card/set that was just saved or refused: the message, the apps a device cannot run, and what could not be checked
function noteFrom(err, okText) {
  if (err) return { ok: false, text: err.message, problems: (err.data && err.data.problems) || [], unchecked: (err.data && err.data.unchecked) || [] };
  return { ok: true, text: okText };
}
function noteBlock(n) {
  if (!n) return null;
  return h("div", {},
    h("div", { class: "msg " + (n.ok ? "ok" : "bad") }, n.text),
    n.problems && n.problems.length ? h("ul", { class: "problems" }, n.problems.map(p => h("li", {}, p.device + ": " + p.reason))) : null,
    n.unchecked && n.unchecked.length ? h("div", { class: "note" }, "Not checked: " + n.unchecked.join("; ")) : null);
}

function when(iso) {
  if (!iso || iso.startsWith("0001")) return "";
  const d = new Date(iso);
  return d.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

const sourceById = id => (state.sources || []).find(s => s.id === id);
const defaultSource = () => (state.sources || [])[0]; // the first source is preferred when an app is in several

// the device's current choice as a Map(package -> source id)
function selection(dev) {
  if (dirty[dev.id]) return dirty[dev.id];
  const m = new Map();
  for (const c of dev.apps || []) m.set(c.package, c.source);
  return m;
}

// which source an app uses when ticked: keep the saved choice, else the default source if it has the app
function pickSource(app, wanted) {
  if (wanted && app.sources.some(s => s.id === wanted)) return wanted;
  const def = defaultSource();
  if (def && app.sources.some(s => s.id === def.id)) return def.id;
  return app.sources[0].id;
}

const setById = id => (state.sets || []).find(x => x.id === id);

// One row per app the patch sources support. sel: Map(package -> source id). locked: Map(package ->
// label) for apps a device gets from a set (shown ticked and disabled). onChange(newMap).
function appGrid(idPrefix, sel, installs, locked, onChange) {
  return h("div", { class: "apps" }, (state.apps || []).map(a => {
    const chosen = sel.get(a.package);
    const src = a.sources.find(s => s.id === pickSource(a, chosen)) || a.sources[0];
    const srcInfo = sourceById(src.id) || {};
    const inst = (installs || {})[a.package];
    const lock = locked && locked.get(a.package);
    const id = idPrefix + "-" + a.package;
    return h("div", { class: "app" + (lock ? " locked" : "") },
      h("input", { type: "checkbox", id, checked: sel.has(a.package) || !!lock, disabled: !!lock, onchange: ev => {
        const m = new Map(sel);
        ev.target.checked ? m.set(a.package, pickSource(a, chosen)) : m.delete(a.package);
        onChange(m);
      } }),
      h("span", { class: "grow" },
        h("label", { for: id },
          a.name,
          lock ? h("span", { class: "chip" }, "from " + lock) : null,
          src.experimental ? h("span", { class: "chip warn" }, "experimental") : null,
          srcInfo.allow_phone ? h("span", { class: "chip warn", title: "A phone app: it may install but not show in the TV launcher" }, "phone app") : null),
        h("span", { class: "meta" }, "newest supported " + src.newest + (inst ? " · installed " + inst.apk_version + " (" + when(inst.installed_at) + ")" : "")),
        !lock && a.sources.length > 1 ? h("span", { class: "meta" }, "patches from ",
          h("select", { onchange: ev => { const m = new Map(sel); m.set(a.package, ev.target.value); onChange(m); } },
            a.sources.map(s => h("option", { value: s.id, selected: s.id === src.id }, (sourceById(s.id) || {}).repo || s.id)))) : null));
  }));
}

function deviceSets(dev) { return dirtySets[dev.id] || new Set(dev.sets || []); }

function deviceCard(dev) {
  const sel = selection(dev);
  const sets = deviceSets(dev);
  const isDirty = !!dirty[dev.id] || !!dirtySets[dev.id];
  const last = dev.last || [];
  const offline = last.some(r => !r.ok && !r.package);
  const note = notes[dev.id];

  // apps this device gets from its sets (shown locked), by set name
  const locked = new Map();
  for (const e of dev.effective || []) if (e.via && e.via.startsWith("set:") && !sel.has(e.package) && sets.has(e.via.slice(4))) locked.set(e.package, (setById(e.via.slice(4)) || {}).name || "a set");
  if (dirtySets[dev.id]) { // unsaved: show what the ticked sets would give
    locked.clear();
    for (const sid of sets) { const st = setById(sid); if (st) for (const c of st.apps || []) if (!sel.has(c.package) && !locked.has(c.package)) locked.set(c.package, st.name); }
  }
  const apps = appGrid("c-" + dev.id, sel, dev.installs, locked, m => { dirty[dev.id] = m; render(); });

  const setChecks = (state.sets || []).length ? h("div", {},
    h("div", { class: "sub" }, "App sets for this TV"),
    h("div", { class: "checks" }, (state.sets || []).map(st => h("label", {},
      h("input", { type: "checkbox", checked: sets.has(st.id), onchange: ev => {
        const next = new Set(deviceSets(dev));
        ev.target.checked ? next.add(st.id) : next.delete(st.id);
        dirtySets[dev.id] = next; render();
      } }), " " + st.name + " (" + (st.apps || []).length + ")")))) : null;

  const pairForm = openPair[dev.id] ? h("div", { class: "row", style: "margin-top:8px" },
    h("span", { class: "sub" }, "On the TV choose “Pair device with pairing code”, then enter the port and code it shows:"),
    h("input", { type: "number", id: "pp-" + dev.id, placeholder: "pairing port", min: 1024, max: 65535, style: "width:130px" }),
    h("input", { type: "text", id: "pc-" + dev.id, placeholder: "6-digit code", maxlength: 6, inputmode: "numeric", style: "width:120px" }),
    h("button", { onclick: () => doPair(dev) }, "Pair")) : null;

  const paired = dev.info && dev.info.paired_at;
  const cpu = dev.info && dev.info.abis && dev.info.abis.length
    ? h("span", { class: "chip", title: "What the device reports; builds are chosen to match" },
        (dev.is64 ? "64-bit capable" : "32-bit") + " · " + dev.info.abis.join(", ") + " · Android API " + dev.info.sdk)
    : null;
  const pairChip = paired ? h("span", { class: "chip" }, "paired") : (cpu ? null : h("span", { class: "chip warn" }, "not paired yet"));

  return h("section", { class: "card" },
    h("div", { class: "row" },
      h("span", { class: "grow" },
        h("strong", {}, h("span", { class: "dot " + (last.length ? (offline ? "bad" : "ok") : "") }), dev.name),
        h("span", { class: "sub" }, "  " + dev.host),
        pairChip, cpu),
      h("button", { onclick: () => { openPair[dev.id] = !openPair[dev.id]; render(); } }, "Pair…"),
      h("button", { onclick: () => doRun(dev.id) }, "Run now"),
      h("button", { class: "danger", onclick: () => doRemove(dev) }, "Remove")),
    pairForm,
    setChecks,
    h("div", { class: "sub", style: "margin-top:8px" }, (state.sets || []).length ? "Extra apps for this TV only" : "Apps for this TV (create an app set to give the same apps to several TVs)"),
    apps,
    h("div", { class: "row" },
      h("button", { class: "primary", disabled: !isDirty, onclick: () => doSave(dev) }, "Save"),
      h("button", { disabled: sel.size === 0 || isDirty, title: "Move this TV's own apps into a new set that this TV uses", onclick: () => doMakeSet(dev) }, "Make a set from these apps"),
      h("span", { class: "sub" }, isDirty ? "Unsaved changes. Saving never installs anything." : "Saved. Installs happen on the next run.")),
    noteBlock(note),
    last.length ? h("ul", { class: "results" }, last.map(r => h("li", { class: r.ok ? "ok" : "bad" }, r.message))) : null);
}

// ---- app sets ----
function draftFor(set) {
  if (!setDraft[set.id]) {
    const m = new Map(); for (const c of set.apps || []) m.set(c.package, c.source);
    const users = (state.devices || []).filter(d => (d.sets || []).includes(set.id)).map(d => d.id);
    setDraft[set.id] = { name: set.name, apps: m, devices: new Set(users), dirty: false };
  }
  return setDraft[set.id];
}

// a collapsed one-line summary per set; the editor opens on demand (and stays open while edited)
function setDetails(st) {
  const d = draftFor(st);
  const users = (state.devices || []).filter(x => d.devices.has(x.id)).map(x => x.name);
  return h("details", { class: "setbox", open: !!setOpen[st.id] || d.dirty || !!setNotes[st.id], ontoggle: ev => { setOpen[st.id] = ev.target.open; } },
    h("summary", {}, h("strong", {}, st.name), " · " + (((st.apps || []).length === 1) ? "1 app" : (st.apps || []).length + " apps") + " · " + (users.length ? "used by " + users.join(", ") : "not used by any TV yet")),
    setEditor(st, false));
}

function setEditor(set, isNew) {
  const d = draftFor(set);
  const touch = f => { f(); d.dirty = true; render(); };
  const usedBy = (state.devices || []);
  return h("div", { class: isNew ? "setbox" : "seted" },
    h("div", { class: "row" },
      h("input", { type: "text", value: d.name, maxlength: 60, placeholder: "Set name (Streaming)", style: "min-width:200px",
        oninput: ev => { d.name = ev.target.value; d.dirty = true; const b = document.getElementById("save-" + set.id); if (b) b.disabled = false; } }),
      h("span", { class: "grow" }),
      isNew ? h("button", { onclick: () => { delete setDraft[set.id]; render(); } }, "Cancel")
            : h("button", { class: "danger", onclick: () => doRemoveSet(set) }, "Delete set")),
    h("div", { class: "sub", style: "margin-top:6px" }, "Used by"),
    h("div", { class: "checks" }, usedBy.length ? usedBy.map(dv => h("label", {},
      h("input", { type: "checkbox", checked: d.devices.has(dv.id), onchange: ev => touch(() => { ev.target.checked ? d.devices.add(dv.id) : d.devices.delete(dv.id); }) }),
      " " + dv.name)) : h("span", { class: "sub" }, "Add a device first")),
    appGrid("s-" + set.id, d.apps, null, null, m => touch(() => { d.apps = m; })),
    h("div", { class: "row" },
      h("button", { class: "primary", id: "save-" + set.id, disabled: !isNew && !d.dirty, onclick: () => doSaveSet(set, isNew) }, isNew ? "Create set" : "Save set"),
      h("span", { class: "sub" }, "Saving pushes the apps to every TV ticked above on its next run.")),
    noteBlock(setNotes[set.id]));
}

function setsCard() {
  const sets = state.sets || [];
  const creating = !!setDraft["__new"];
  return [
    h("div", { class: "row" },
      h("strong", { class: "grow" }, "App sets"),
      creating ? null : h("button", { onclick: () => { setDraft["__new"] = { name: "", apps: new Map(), devices: new Set(), dirty: true }; render(); } }, "New set")),
    h("div", { class: "sub" }, "Pick apps once, then give the set to several TVs. A TV that cannot run an app in a set is refused when you save, with the reason."),
    creating ? setEditor({ id: "__new", name: "", apps: [] }, true) : null,
    sets.length ? sets.map(st => setDetails(st)) : (creating ? null : h("div", { class: "sub", style: "margin-top:8px" }, "No sets yet.")),
  ];
}

function sourcesCard() {
  const rows = (state.sources || []).map(src => h("div", { class: "src" },
    h("span", { class: "grow" },
      h("strong", {}, src.repo),
      src.prerelease ? h("span", { class: "chip" }, "pre-releases") : null,
      src.allow_phone ? h("span", { class: "chip warn" }, "allows phone apps") : null,
      h("span", { class: "meta" }, src.error ? "problem: " + src.error : ((src.tag || "not loaded yet") + " · " + src.apps + " apps")),
      src.warning ? h("span", { class: "meta msg bad" }, "unreachable, using its last good bundle. If it is gone for good, remove it. (" + src.warning + ")") : null),
    h("button", { class: "danger", onclick: () => doRemoveSource(src) }, "Remove")));

  const owners = (state.allowed_owners || []);
  return [
    h("strong", {}, "Patch sources"),
    h("div", { class: "sub" }, "GitHub repositories that publish Morphe patch bundles. Each one adds the apps it can patch."),
    h("div", { style: "margin-top:8px" }, rows.length ? rows : h("div", { class: "sub" }, "No patch repositories yet. Add one below to see which apps you can patch.")),
    h("div", { class: "row", style: "margin-top:10px" },
      h("input", { type: "text", id: "newrepo", placeholder: "owner/repository", maxlength: 201, style: "min-width:220px" }),
      h("label", { class: "sub" }, h("input", { type: "checkbox", id: "newpre" }), " include pre-releases"),
      h("label", { class: "sub" }, h("input", { type: "checkbox", id: "newphone" }), " allow phone apps"),
      h("button", { onclick: doAddSource }, "Add repository")),
    h("div", { class: "warnbox" },
      h("label", {}, h("input", { type: "checkbox", id: "newtrust" }),
        " I trust this repository. Its patches run on this server (which holds your signing key) and the patched apps are installed on my TVs. Only add repositories you would run code from."),
      owners.length ? h("div", { class: "sub" }, "Only these owners are allowed: " + owners.join(", ")) : null),
    sourceNote ? h("div", { class: "msg " + (sourceNote.ok ? "ok" : "bad") }, sourceNote.text) : null,
  ];
}

function render() {
  if (!state) return;
  const st = state.status || {};
  const tags = (state.sources || []).map(s => s.tag).filter(Boolean);
  document.getElementById("sub").textContent =
    "patches " + (tags.length ? tags.join(" · ") : (st.patches_version || "?")) + " · " + (st.running ? "running…" : (st.finished_at && !st.finished_at.startsWith("0001") ? "last run " + when(st.finished_at) : "no run yet")) +
    (state.version ? " · " + state.version : "");
  document.getElementById("runall").disabled = !!st.running;
  const box = document.getElementById("devices");
  box.replaceChildren(...((state.devices || []).length
    ? state.devices.map(deviceCard)
    : [h("div", { class: "card empty" }, "No devices yet. Add one below.")]));
  // keep what is being typed in the add-repository form
  const keep = ["newrepo", "newpre", "newphone", "newtrust"].map(id => { const e = document.getElementById(id); return e ? [id, e.type === "checkbox" ? e.checked : e.value] : null; }).filter(Boolean);
  document.getElementById("sources").replaceChildren(...sourcesCard().filter(Boolean));
  const keepName = document.activeElement && document.activeElement.type === "text" && document.getElementById("sets").contains(document.activeElement) ? document.activeElement : null;
  if (!keepName) document.getElementById("sets").replaceChildren(...setsCard().flat().filter(Boolean));
  for (const [id, v] of keep) { const e = document.getElementById(id); if (e) { if (e.type === "checkbox") e.checked = v; else e.value = v; } }
}

async function refresh() {
  try { state = await api("GET", "/api/state"); render(); } catch (e) { document.getElementById("sub").textContent = "cannot reach the server: " + e.message; }
  const running = state && state.status && state.status.running;
  if (document.getElementById("logbox").open) loadLog();
  setTimeout(refresh, running ? 4000 : 30000);
}

async function loadLog() {
  try { const l = await api("GET", "/api/log"); const pre = document.getElementById("log"); pre.textContent = l.lines.join("\n") || "(empty)"; pre.scrollTop = pre.scrollHeight; } catch (e) { /* ignore */ }
}

async function doSave(dev) {
  let unchecked = [];
  try {
    if (dirtySets[dev.id]) {
      const r = await api("PUT", "/api/devices/" + encodeURIComponent(dev.id) + "/sets", { sets: [...dirtySets[dev.id]] });
      unchecked = unchecked.concat(r.unchecked || []);
      delete dirtySets[dev.id];
    }
    if (dirty[dev.id]) {
      const apps = [...dirty[dev.id]].map(([pkg, src]) => ({ package: pkg, source: src }));
      const r = await api("PUT", "/api/devices/" + encodeURIComponent(dev.id) + "/apps", { apps });
      unchecked = unchecked.concat(r.unchecked || []);
      delete dirty[dev.id];
    }
    notes[dev.id] = { ok: true, text: "Saved.", unchecked };
  } catch (e) { notes[dev.id] = noteFrom(e); }
  await reload();
}

async function doMakeSet(dev) {
  const name = prompt("Name for the new set (the apps you ticked for " + dev.name + " move into it):");
  if (!name) return;
  const apps = [...selection(dev)].map(([pkg, src]) => ({ package: pkg, source: src }));
  try {
    await api("POST", "/api/sets", { name, apps, devices: [dev.id] });
    await api("PUT", "/api/devices/" + encodeURIComponent(dev.id) + "/apps", { apps: [] });
    delete dirty[dev.id];
    notes[dev.id] = { ok: true, text: "Created the set “" + name + "”. This TV uses it now; give it to other TVs under App sets." };
  } catch (e) { notes[dev.id] = noteFrom(e); }
  await reload();
}

async function doSaveSet(set, isNew) {
  const d = setDraft[set.id];
  const body = { name: d.name, apps: [...d.apps].map(([pkg, src]) => ({ package: pkg, source: src })), devices: [...d.devices] };
  setNotes[set.id] = { ok: true, text: "Saving… (checking each TV can run these apps)" }; render();
  try {
    const r = isNew ? await api("POST", "/api/sets", body) : await api("PUT", "/api/sets/" + encodeURIComponent(set.id), body);
    delete setDraft[set.id];
    delete setNotes[set.id];
    if (r.unchecked && r.unchecked.length) setNotes[isNew ? (r.set || {}).id : set.id] = { ok: true, text: "Saved.", unchecked: r.unchecked };
    for (const k of Object.keys(dirtySets)) delete dirtySets[k];
  } catch (e) { setNotes[set.id] = noteFrom(e); }
  await reload();
}

async function doRemoveSet(set) {
  const users = (state.devices || []).filter(d => (d.sets || []).includes(set.id)).map(d => d.name);
  if (!confirm("Delete the set “" + set.name + "”?" + (users.length ? " It is used by " + users.join(", ") + ". Their apps from this set are no longer kept up to date (nothing is uninstalled)." : ""))) return;
  try { await api("DELETE", "/api/sets/" + encodeURIComponent(set.id)); delete setDraft[set.id]; } catch (e) { alert(e.message); }
  await reload();
}

async function doRun(device) {
  try { await api("POST", "/api/run", { device: device || "", force: document.getElementById("force").checked }); } catch (e) { alert(e.message); }
  await reload(); setTimeout(refresh, 1500);
}

async function doPair(dev) {
  const port = parseInt(document.getElementById("pp-" + dev.id).value, 10);
  const code = document.getElementById("pc-" + dev.id).value.trim();
  notes[dev.id] = { ok: true, text: "Pairing…" }; render();
  try {
    const r = await api("POST", "/api/devices/" + encodeURIComponent(dev.id) + "/pair", { pair_port: port, code });
    notes[dev.id] = { ok: true, text: r.message }; openPair[dev.id] = false;
  } catch (e) { notes[dev.id] = noteFrom(e); }
  render();
}

async function doRemove(dev) {
  if (!confirm("Remove " + dev.name + "? Nothing is uninstalled from the TV.")) return;
  try { await api("DELETE", "/api/devices/" + encodeURIComponent(dev.id)); delete dirty[dev.id]; } catch (e) { alert(e.message); }
  await reload();
}

async function doAddSource() {
  const body = {
    repo: document.getElementById("newrepo").value,
    prerelease: document.getElementById("newpre").checked,
    allow_phone: document.getElementById("newphone").checked,
    trust: document.getElementById("newtrust").checked,
  };
  sourceNote = { ok: true, text: "Checking the repository…" }; render();
  try {
    const s = await api("POST", "/api/sources", body);
    sourceNote = { ok: true, text: "Added " + s.repo + ". Its apps appear on the device cards in a moment." };
    for (const id of ["newrepo", "newpre", "newphone", "newtrust"]) { const e = document.getElementById(id); if (e) { if (e.type === "checkbox") e.checked = false; else e.value = ""; } }
    setTimeout(reload, 4000);
  } catch (e) { sourceNote = { ok: false, text: e.message }; }
  await reload();
}

async function doRemoveSource(src) {
  if (!confirm("Remove " + src.repo + "? Apps on your devices that use its patches are dropped from the lists (nothing is uninstalled).")) return;
  try {
    const r = await api("DELETE", "/api/sources/" + encodeURIComponent(src.id));
    sourceNote = { ok: true, text: "Removed " + src.repo + (r.apps_dropped ? "; " + r.apps_dropped + " app choice(s) dropped." : ".") };
    for (const k of Object.keys(dirty)) delete dirty[k];
  } catch (e) { sourceNote = { ok: false, text: e.message }; }
  await reload();
}

async function reload() { try { state = await api("GET", "/api/state"); } catch (e) { /* keep old */ } render(); }

document.getElementById("runall").addEventListener("click", () => doRun(""));
document.getElementById("adddev").addEventListener("click", async () => {
  const msg = document.getElementById("addmsg");
  try {
    const d = await api("POST", "/api/devices", { name: document.getElementById("newname").value, host: document.getElementById("newhost").value });
    document.getElementById("newname").value = ""; document.getElementById("newhost").value = "";
    msg.className = "msg ok"; msg.textContent = "Added. Use “Pair…” on its card next.";
    openPair[d.id] = true;
  } catch (e) { msg.className = "msg bad"; msg.textContent = e.message; }
  await reload();
});
document.getElementById("logbox").addEventListener("toggle", ev => { if (ev.target.open) loadLog(); });
refresh();
</script>
</body>
</html>
